name: Deploy Docs

# Triggered by:
#   1. repository_dispatch from helixscreen when a release is published
#      (event type: helixscreen-release); any release may change any version,
#      so every version's ref is resolved again
#   2. workflow_dispatch: manual run, optionally pinning refs per version
#   3. push to main: website-only changes (landing pages, theme, sync script)
#
# Each documentation version in src/data/doc-versions.mjs is built from the
# newest published helixscreen release with its tag prefix, or its fallback
# ref when none exists (scripts/resolve-doc-refs.mjs).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID — from Cloudflare dashboard

on:
  repository_dispatch:
    types: [helixscreen-release]
  workflow_dispatch:
    inputs:
      refs:
        description: "Pin helixscreen refs per docs version, e.g. '1.0=main 1.1=main' (blank resolves every version from releases)"
        required: false
        default: ""
  push:
    branches: [main]

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve helixscreen refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDES: ${{ inputs.refs }}
        run: |
          # One NAME=ref line per docs version; sync-docs.sh reads these names.
          node scripts/resolve-doc-refs.mjs --override "$OVERRIDES" > "$RUNNER_TEMP/doc-refs.env"
          cat "$RUNNER_TEMP/doc-refs.env"
          cat "$RUNNER_TEMP/doc-refs.env" >> "$GITHUB_ENV"
          echo "current=$(sed -n 's/^HELIX_DOCS_REF=//p' "$RUNNER_TEMP/doc-refs.env")" >> "$GITHUB_OUTPUT"

      - name: Checkout helixscreen (docs source)
        # The working tree is the current version: the gen-* scripts read it.
        # gen-repo-stats counts commits, so it needs full history; blob:none
        # keeps that to commits and trees, with file contents fetched on demand.
        uses: actions/checkout@v5
        with:
          repository: prestonbrown/helixscreen
          ref: ${{ steps.refs.outputs.current }}
          path: helixscreen-src
          fetch-depth: 0
          filter: blob:none

      - name: Fetch the other docs versions' refs
        # sync-docs.sh reads each other version with `git archive`, resolving
        # a name locally or as origin/<name>. No --depth: a shallow fetch would
        # make the clone shallow again and gen-repo-stats would refuse its count.
        run: |
          while IFS='=' read -r name ref; do
            [ "$name" = HELIX_DOCS_REF ] && continue
            git -C helixscreen-src fetch --no-tags origin "+$ref:refs/remotes/origin/$ref"
          done < "$RUNNER_TEMP/doc-refs.env"

      - name: Expose helixscreen at ../helixscreen
        # sync-docs.sh reads from $PROJECT_ROOT/../helixscreen.
        # actions/checkout refuses paths outside the workspace, so we symlink.
        run: ln -s "$GITHUB_WORKSPACE/helixscreen-src" "$GITHUB_WORKSPACE/../helixscreen"

      - name: Install dependencies
        run: npm ci

      - name: Stage the ESP32 K-Touch firmware for /flash/
        # The browser flasher fetches the part images from this site: GitHub
        # release downloads and releases.helixscreen.org send no CORS headers.
        # With no release carrying the zip, this stages nothing and the page
        # says so.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-esp32-firmware.mjs

      - name: Build site (prebuild runs sync-docs.sh)
        # Astro's content layer intermittently fails to see an entry that
        # sync-docs.sh just wrote and aborts with "The slug ... does not exist".
        # It killed the v0.99.101 docs deploy twice while the identical inputs
        # built cleanly everywhere else, so retry: a fresh attempt re-runs the
        # sync and has cleared it every time.
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              echo "Site build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning title=Docs build retry::Site build failed on attempt $attempt of 3"
            rm -rf dist .astro node_modules/.astro
            sleep 5
          done
          echo "::error title=Docs build failed::Site build failed after 3 attempts"
          exit 1

      - name: Verify every synced doc produced a page
        # The failure mode above loses individual entries, so a build can exit 0
        # with pages silently missing. Deploying that would replace good docs
        # with an incomplete tree, so check before publishing rather than after.
        run: |
          missing=0
          expected=0
          while IFS= read -r md; do
            rel=${md#src/content/docs/}
            case "$rel" in
              index.md)   route=index.html ;;
              404.md)     route=404.html ;;
              */index.md) route="${rel%/index.md}/index.html" ;;
              *)          route="${rel%.md}/index.html" ;;
            esac
            expected=$((expected + 1))
            if [ ! -s "dist/$route" ]; then
              echo "::error::synced doc produced no page: $rel -> dist/$route"
              missing=$((missing + 1))
            fi
          done < <(find src/content/docs -name '*.md' | sort)
          built=$(find dist -name '*.html' | wc -l)
          echo "$expected docs synced, $built HTML pages built, $missing missing"
          if [ "$missing" -gt 0 ]; then
            echo "::error title=Incomplete docs build::$missing page(s) missing - refusing to deploy"
            exit 1
          fi

      - name: Verify the build passes the design-system and copy gate
        run: npm test

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=helixscreen-website \
            --branch=main \
            --commit-dirty=true
